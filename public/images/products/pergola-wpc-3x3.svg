<svg xmlns="http://www.w3.org/2000/svg" width="900" height="675" viewBox="0 0 900 675">
  <defs>
    <linearGradient id="bgp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101d18"/>
      <stop offset="1" stop-color="#0a120e"/>
    </linearGradient>
    <linearGradient id="woodp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c3d23"/>
      <stop offset="1" stop-color="#3a2716"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe699" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe699" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="675" fill="url(#bgp)"/>
  <rect y="560" width="900" height="115" fill="#0d1813"/>

  <!-- posts -->
  <rect x="180" y="140" width="34" height="430" fill="#1e293b"/>
  <rect x="686" y="140" width="34" height="430" fill="#1e293b"/>

  <!-- main beam -->
  <rect x="150" y="120" width="600" height="34" rx="6" fill="#1e293b"/>
  <!-- wpc louvers -->
  <g fill="url(#woodp)">
    <rect x="170" y="80" width="560" height="16" rx="8"/>
    <rect x="190" y="52" width="520" height="16" rx="8"/>
  </g>

  <!-- side beams -->
  <rect x="180" y="154" width="540" height="16" fill="#2c3e50" opacity="0.8"/>

  <!-- spot lights -->
  <g>
    <ellipse cx="300" cy="200" rx="46" ry="30" fill="url(#lamp)" opacity="0.55"/>
    <ellipse cx="450" cy="200" rx="46" ry="30" fill="url(#lamp)" opacity="0.55"/>
    <ellipse cx="600" cy="200" rx="46" ry="30" fill="url(#lamp)" opacity="0.55"/>
    <circle cx="300" cy="172" r="8" fill="#ffe699"/>
    <circle cx="450" cy="172" r="8" fill="#ffe699"/>
    <circle cx="600" cy="172" r="8" fill="#ffe699"/>
  </g>

  <!-- floor shadow -->
  <ellipse cx="450" cy="570" rx="320" ry="18" fill="#000000" opacity="0.4"/>
</svg>
