<svg xmlns="http://www.w3.org/2000/svg" width="900" height="675" viewBox="0 0 900 675">
  <defs>
    <linearGradient id="bgf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101d18"/>
      <stop offset="1" stop-color="#0a120e"/>
    </linearGradient>
    <linearGradient id="woodf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a4551f"/>
      <stop offset="1" stop-color="#6e3a15"/>
    </linearGradient>
    <radialGradient id="fire" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.4" stop-color="#f97316"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="675" fill="url(#bgf)"/>
  <rect y="540" width="900" height="135" fill="#0d1813"/>

  <!-- box base -->
  <rect x="220" y="300" width="460" height="240" rx="14" fill="url(#woodf)"/>
  <rect x="220" y="300" width="460" height="20" rx="10" fill="#b5692a"/>

  <!-- table top slats -->
  <g fill="#b5692a">
    <rect x="200" y="268" width="500" height="14" rx="7"/>
    <rect x="200" y="288" width="500" height="14" rx="7"/>
  </g>

  <!-- central burner -->
  <rect x="400" y="270" width="100" height="24" rx="8" fill="#18181b"/>
  <g stroke="#2a2a2e" stroke-width="6" stroke-linecap="round">
    <line x1="412" y1="282" x2="412" y2="262"/>
    <line x1="435" y1="282" x2="435" y2="258"/>
    <line x1="458" y1="282" x2="458" y2="260"/>
    <line x1="481" y1="282" x2="481" y2="264"/>
  </g>
  <!-- flame glow -->
  <ellipse cx="446" cy="240" rx="70" ry="46" fill="url(#fire)" opacity="0.85"/>
  <path d="M 446 200 Q 466 226 446 250 Q 428 226 446 200" fill="#fbbf24" opacity="0.9"/>

  <!-- lava rocks -->
  <g fill="#2b2b2f">
    <circle cx="415" cy="272" r="9"/>
    <circle cx="440" cy="276" r="8"/>
    <circle cx="465" cy="272" r="9"/>
    <circle cx="488" cy="276" r="7"/>
  </g>

  <!-- warm under-glow -->
  <rect x="220" y="500" width="460" height="12" fill="#f97316" opacity="0.2"/>
</svg>
