<svg xmlns="http://www.w3.org/2000/svg" width="900" height="675" viewBox="0 0 900 675">
  <defs>
    <linearGradient id="bgu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101d18"/>
      <stop offset="1" stop-color="#0a120e"/>
    </linearGradient>
    <linearGradient id="canopy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#374151"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
  </defs>
  <rect width="900" height="675" fill="url(#bgu)"/>
  <rect y="560" width="900" height="115" fill="#0d1813"/>

  <!-- base -->
  <rect x="150" y="520" width="180" height="44" rx="10" fill="#18181b"/>
  <!-- mast -->
  <rect x="230" y="180" width="20" height="350" fill="#2a2a2e"/>
  <!-- cantilever arm -->
  <path d="M 240 200 Q 380 120 560 150" stroke="#2a2a2e" stroke-width="18" fill="none" stroke-linecap="round"/>

  <!-- canopy -->
  <path d="M 320 260 Q 560 140 800 260 Q 560 300 320 260" fill="url(#canopy)"/>
  <g stroke="#111827" stroke-width="4" opacity="0.6">
    <path d="M 420 220 Q 560 180 700 220"/>
    <path d="M 470 200 Q 560 175 650 200"/>
  </g>

  <!-- shade ellipse -->
  <ellipse cx="450" cy="565" rx="240" ry="26" fill="#000000" opacity="0.45"/>

  <!-- lounge under shade -->
  <rect x="360" y="520" width="220" height="18" rx="8" fill="#6b4a2c"/>
  <rect x="380" y="538" width="12" height="26" fill="#18181b"/>
  <rect x="548" y="538" width="12" height="26" fill="#18181b"/>
</svg>
