<svg xmlns="http://www.w3.org/2000/svg" width="900" height="675" viewBox="0 0 900 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101d18"/>
      <stop offset="1" stop-color="#0a120e"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c3d23"/>
      <stop offset="1" stop-color="#3a2716"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3e9e5f"/>
      <stop offset="1" stop-color="#1d5c38"/>
    </linearGradient>
  </defs>
  <rect width="900" height="675" fill="url(#bg)"/>
  <!-- ground line -->
  <rect y="520" width="900" height="155" fill="#0d1813"/>
  <!-- planter box -->
  <rect x="150" y="240" width="600" height="290" rx="14" fill="url(#wood)"/>
  <rect x="150" y="240" width="600" height="26" rx="13" fill="#6b4a2c"/>
  <!-- metal frame accents -->
  <rect x="150" y="300" width="600" height="6" fill="#1a1a1a" opacity="0.6"/>
  <rect x="150" y="440" width="600" height="6" fill="#1a1a1a" opacity="0.6"/>
  <!-- soil -->
  <rect x="170" y="266" width="560" height="24" fill="#241a10"/>
  <!-- shrubs -->
  <circle cx="260" cy="210" r="70" fill="url(#leaf)"/>
  <circle cx="420" cy="185" r="88" fill="#2f7d4c"/>
  <circle cx="590" cy="200" r="76" fill="url(#leaf)"/>
  <circle cx="690" cy="230" r="52" fill="#2f7d4c"/>
  <!-- hidden LED glow under rim -->
  <rect x="150" y="500" width="600" height="10" fill="#ffdd99" opacity="0.35"/>
  <rect x="150" y="510" width="600" height="18" fill="#ffdd99" opacity="0.12"/>
</svg>
