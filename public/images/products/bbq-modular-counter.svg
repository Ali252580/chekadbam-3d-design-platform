<svg xmlns="http://www.w3.org/2000/svg" width="900" height="675" viewBox="0 0 900 675">
  <defs>
    <linearGradient id="bgb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101d18"/>
      <stop offset="1" stop-color="#0a120e"/>
    </linearGradient>
    <linearGradient id="woodb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4a2c"/>
      <stop offset="1" stop-color="#41301c"/>
    </linearGradient>
    <linearGradient id="steelb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b5563"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
  </defs>
  <rect width="900" height="675" fill="url(#bgb)"/>
  <rect y="540" width="900" height="135" fill="#0d1813"/>

  <!-- counter body -->
  <rect x="140" y="280" width="620" height="260" rx="14" fill="url(#woodb)"/>
  <!-- steel countertop -->
  <rect x="120" y="256" width="660" height="30" rx="10" fill="url(#steelb)"/>

  <!-- grill section -->
  <rect x="330" y="238" width="240" height="24" rx="8" fill="#18181b"/>
  <g stroke="#3f3f46" stroke-width="8" stroke-linecap="round">
    <line x1="350" y1="248" x2="550" y2="248"/>
  </g>
  <g fill="#52525b">
    <circle cx="370" cy="230" r="5"/>
    <circle cx="410" cy="228" r="5"/>
    <circle cx="450" cy="230" r="5"/>
    <circle cx="490" cy="228" r="5"/>
    <circle cx="530" cy="230" r="5"/>
  </g>
  <!-- heat glow -->
  <ellipse cx="450" cy="222" rx="90" ry="22" fill="#f97316" opacity="0.25"/>

  <!-- cabinet doors -->
  <rect x="180" y="320" width="120" height="180" rx="8" fill="#513722" stroke="#2a1c0f" stroke-width="4"/>
  <rect x="600" y="320" width="120" height="180" rx="8" fill="#513722" stroke="#2a1c0f" stroke-width="4"/>
  <g fill="#d6cebe">
    <rect x="284" y="396" width="10" height="4" rx="2"/>
    <rect x="606" y="396" width="10" height="4" rx="2"/>
  </g>

  <!-- sink -->
  <rect x="640" y="262" width="100" height="14" rx="6" fill="#374151"/>
</svg>
