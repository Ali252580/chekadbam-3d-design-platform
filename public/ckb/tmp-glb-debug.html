<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>GLB Debug — تاب پرگولادار</title>
<style>
  body { margin:0; background:#0f172a; font-family: sans-serif; }
  #c { width: 100vw; height: 100vh; display: block; }
  #info { position: fixed; top: 8px; right: 8px; color: #a7f3d0; font-size: 13px; background: rgba(0,0,0,.5); padding: 6px 10px; border-radius: 8px; }
  .ang { position: fixed; bottom: 12px; left: 12px; display: flex; gap: 8px; }
  .ang button { padding: 6px 10px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">GLB Debug Viewer</div>
<div class="ang">
  <button onclick="setAng(0)">زاویهٔ مرجع</button>
  <button onclick="setAng(1)">نمای سه‌رخ</button>
  <button onclick="setAng(2)">نمای جلو</button>
</div>
<script src="assets/three.min.js"></script>
<script src="assets/ckb-gltfloader.js"></script>
<script>
  var renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(devicePixelRatio);
  renderer.shadowMap.enabled = false;
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0f172a);
  var camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 100);
  var light = new THREE.DirectionalLight(0xffffff, 2.2);
  light.position.set(4, 6, 5);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0xffffff, 1.1));
  var grid = new THREE.GridHelper(4, 8, 0x334155, 0x1e293b);
  scene.add(grid);
  var model = null;
  new window.GLTFLoader().load('assets/models/swing-pergola-flowerbox.glb', function (gltf) {
    model = gltf.scene;
    scene.add(model);
    fitCam();
  });
  function fitCam() {
    if (!model) return;
    var box = new THREE.Box3().setFromObject(model);
    var size = new THREE.Vector3(); box.getSize(size);
    var center = new THREE.Vector3(); box.getCenter(center);
    document.getElementById('info').innerText = 'bbox  W=' + size.x.toFixed(2) + '  H=' + size.y.toFixed(2) + '  D=' + size.z.toFixed(2);
    var r = Math.max(size.x, size.y, size.z) * 1.6;
    camera.position.set(center.x + r, center.y + r * 0.75, center.z + r);
    camera.lookAt(center);
  }
  window.setAng = function (i) {
    if (!model) return;
    var box = new THREE.Box3().setFromObject(model);
    var size = new THREE.Vector3(); box.getSize(size);
    var center = new THREE.Vector3(); box.getCenter(center);
    var r = Math.max(size.x, size.y, size.z) * 1.6;
    if (i === 0) camera.position.set(center.x + r*0.55, center.y + r*0.42, center.z + r*0.85);
    if (i === 1) camera.position.set(center.x + r, center.y + r*0.75, center.z + r);
    if (i === 2) camera.position.set(center.x, center.y + r*0.25, center.z + r*1.3);
    camera.lookAt(center);
  };
  function loop(){ requestAnimationFrame(loop); renderer.render(scene, camera); }
  loop();
</script>
</body>
</html>
